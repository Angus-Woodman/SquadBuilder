[project]
name = "squad-builder-backend"
version = "0.1.0"
description = "Backend for squad-builder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt>=4.3.0",
    "fastapi>=0.128.8",
    "pydantic[email]>=2.0",
    "psycopg[binary]>=3.3.2",
    "PyJWT>=2.8.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
    "beautifulsoup4>=4.14.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-sugar>=1.1.1",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # let the formatter handle line length; B008 is a false positive for FastAPI Depends()

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-v --durations=10"
testpaths = ["tests"]
